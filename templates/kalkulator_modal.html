<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Modal - ATMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="max-w-md w-full bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-xl font-bold mb-4 text-gray-800">Kalkulator Modal ATMS</h2>
        <p class="text-sm text-gray-600 mb-4">Gunakan halaman ini untuk menghitung kalkulasi transfer dan modal.</p>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">Jumlah Nominal</label>
            <input type="number" id="nominal" class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="Masukkan nominal">
        </div>
        <a href="/dashboard" class="w-full text-center block bg-green-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-green-700">Kembali ke Dashboard</a>
    </div>
</body>
</html>
