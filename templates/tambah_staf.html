<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tambah Staf - ATMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Tambah Akses Pengguna</h2>
        <p class="text-sm text-gray-500 mb-6">Daftarkan Staf atau CEO baru ke sistem ATMS.</p>
        
        <form action="/tambah-staf" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Nama Lengkap</label>
                <input type="text" name="nama_lengkap" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" name="username" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" name="password" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Hak Akses (Role)</label>
                <select name="role" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                    <option value="staff">Staf (Kasir / Input Transaksi)</option>
                    <option value="ceo">CEO (Owner / Lihat Laporan)</option>
                </select>
            </div>
            <div class="flex space-x-3 pt-2">
                <button type="submit" class="flex-1 bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700 transition">Simpan</button>
                <a href="/dashboard" class="flex-1 bg-gray-200 text-center py-2 rounded-lg font-semibold text-gray-700 hover:bg-gray-300 transition">Kembali</a>
            </div>
        </form>
    </div>
</body>
</html>
